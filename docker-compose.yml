version: '3.8'

services:
  # Host Shell Application Service
  host-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: host
    container_name: mfe-host
    restart: always
    expose:
      - "80"

  # Remote 1: Dashboard MFE Service
  remote1-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: remote1
    container_name: mfe-remote1
    restart: always
    expose:
      - "80"

  # Remote 2: Security Profile MFE Service
  remote2-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: remote2
    container_name: mfe-remote2
    restart: always
    expose:
      - "80"

  # Central Nginx Ingress Gateway Proxy
  nginx-gateway:
    image: nginx:1.25-alpine
    container_name: mfe-gateway
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - host-service
      - remote1-service
      - remote2-service
